# Builds the Lambda container image, pushes it to ECR, and points the
# Lambda function at the new image.
#
# Runs on pushes to main that touch the inference code or the Lambda build
# files, and on manual dispatch.
#
# Credentials: GitHub OIDC only. No long-lived AWS access keys are stored in
# this repository. See docs/cicd.md for the IAM role setup.
name: build-deploy

on:
  push:
    branches:
      - main
    paths:
      - 'inference/**'
      - 'deploy/lambda/**'
      - 'eval/**'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to push. Defaults to the commit short sha.'
        required: false
        type: string
        default: ''

# id-token: write is what lets the runner request an OIDC token and assume the
# AWS role. contents: read is all the checkout needs.
permissions:
  contents: read
  id-token: write

# Only one build at a time per branch. A newer push supersedes an in-flight
# build instead of racing it to the :latest tag.
concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPO: logistics-dimension-api
  # 고정셋 평가 데이터가 있는 비공개 버킷과 접두사. 접두사 아래에 VS/{KAN}_{barcode}/*_1_[123].jpg 와
  # index/items.csv 가 있어야 한다. 기준선은 baselines/{접두사}/summary.json 에 둔다.
  EVAL_BUCKET: ${{ vars.EVAL_BUCKET || 'cjj-eval-data-300390308149' }}
  EVAL_PREFIX: ${{ vars.EVAL_PREFIX || 'smoke' }}

jobs:
  build-push:
    name: build and push image
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.meta.outputs.image_uri }}
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # The repository is created once by hand (docs/lambda-deploy.md), so the
      # CI role does not need ecr:CreateRepository. Fail early with a readable
      # message instead of letting the push fail with a bare 404.
      - name: Check that the ECR repository exists
        run: |
          if ! aws ecr describe-repositories \
                 --region "$AWS_REGION" \
                 --repository-names "$ECR_REPO" >/dev/null 2>&1; then
            echo "::error::ECR 저장소 '${ECR_REPO}' 가 리전 ${AWS_REGION} 에 없습니다. docs/lambda-deploy.md 의 '최초 1회 절차' 를 먼저 수행하세요."
            exit 1
          fi
          echo "ECR 저장소 확인: ${ECR_REPO} (${AWS_REGION})"

      # Read the dispatch input through env rather than interpolating it into
      # the script body, so the tag string cannot inject shell commands.
      - name: Resolve image tag
        id: meta
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          TAG="${TAG_INPUT:-$(git rev-parse --short HEAD)}"
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9._-]{1,128}$'; then
            echo "::error::이미지 태그 '${TAG}' 형식이 올바르지 않습니다. 영문·숫자·'.'·'_'·'-' 만 사용하세요."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${REGISTRY}/${ECR_REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "빌드 대상: ${REGISTRY}/${ECR_REPO}:${TAG}"

      # BuildKit is required by the Dockerfile's --mount=type=secret step.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # platforms/provenance are not optional here: Lambda rejects arm64 images
      # and rejects the OCI attestation manifest that Buildx attaches by default.
      #
      # No build cache is configured yet. Once the torch install and the model
      # download steps are enabled the image runs to several GB, which does not
      # fit the GitHub Actions cache quota — an ECR-backed cache would be the
      # replacement. See docs/cicd.md.
      #
      # The token goes through secret-envs rather than secrets: the latter takes
      # the literal value, and an unregistered HF_TOKEN would make the whole step
      # fail with "hf_token= is not a valid secret". secret-envs passes the env
      # var *name*, so the step still runs while the model download step in the
      # Dockerfile is commented out and no token exists yet.
      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          context: .
          file: deploy/lambda/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}:latest
          secret-envs: |
            hf_token=HF_TOKEN

      - name: Summary
        run: |
          {
            echo "### 이미지 push 완료"
            echo ""
            echo "- 이미지: \`${{ steps.meta.outputs.image_uri }}\`"
            echo "- 커밋: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 배포 전 정확도 게이트. push 된 이미지에서 model.onnx 를 꺼내 고정셋으로 평가하고, S3 의 기준선과
  # 비교해 비열화·절대 상한을 통과해야 다음 잡(deploy-lambda)이 돈다. 기준선이 없으면(첫 실행) 후보를
  # 기준선으로 등록하고 통과시킨다. 판정 근거는 잡 요약에 남고 결과 JSON 은 S3 results/ 에 쌓인다.
  eval-gate:
    name: accuracy gate on fixed set
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 평가는 서빙 이미지에 구워진 바로 그 model.onnx 로 한다. 변환을 다시 하지 않는다.
      - name: Extract model from the pushed image
        env:
          IMAGE_URI: ${{ needs.build-push.outputs.image-uri }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE_URI" >/dev/null
          cid=$(docker create --platform linux/amd64 "$IMAGE_URI")
          docker cp "$cid:/opt/model/model.onnx" inference/model.onnx
          docker cp "$cid:/opt/model/config.json" inference/config.json
          docker rm "$cid" >/dev/null
          ls -la inference/model.onnx inference/config.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r inference/requirements-runtime.txt onnx

      - name: Download fixed evaluation set
        run: |
          set -euo pipefail
          aws s3 sync "s3://${EVAL_BUCKET}/${EVAL_PREFIX}" data --only-show-errors
          test -f data/index/items.csv
          echo "품목 폴더: $(find data/VS -mindepth 1 -maxdepth 1 -type d | wc -l)"

      - name: Evaluate candidate (FP32, serving preprocessing)
        run: |
          python eval/eval_variants.py --vs data/VS --items data/index/items.csv \
            --model-dir inference --out results --threads 2 --variants fp32

      - name: Judge against baseline
        id: gate
        run: |
          set -euo pipefail
          key="baselines/${EVAL_PREFIX}/summary.json"
          if aws s3 cp "s3://${EVAL_BUCKET}/${key}" baseline.json --only-show-errors 2>/dev/null; then
            set +e
            python eval/gate.py --baseline baseline.json:fp32 --candidate results/summary.json:fp32 | tee verdict.json
            rc=${PIPESTATUS[0]}
            set -e
          else
            echo "기준선 없음 — 이 후보를 기준선으로 등록하고 통과시킨다."
            printf '{"pass": true, "reasons": ["bootstrap: 기준선 없음"]}\n' | tee verdict.json
            rc=0
          fi
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          {
            echo "### 정확도 게이트 (${EVAL_PREFIX})"
            echo ""
            echo '```json'; cat verdict.json; echo '```'
            echo ""
            echo '후보 요약:'; echo '```json'
            python -c "import json;print(json.dumps(json.load(open('results/summary.json'))['summary']['fp32'],indent=1))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Keep results
        if: always()
        env:
          TAG: ${{ needs.build-push.outputs.image-tag }}
        run: |
          [ -f results/summary.json ] || exit 0
          aws s3 cp results/summary.json "s3://${EVAL_BUCKET}/results/${EVAL_PREFIX}/${TAG}/summary.json" --only-show-errors
          [ -f verdict.json ] && aws s3 cp verdict.json "s3://${EVAL_BUCKET}/results/${EVAL_PREFIX}/${TAG}/verdict.json" --only-show-errors || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-${{ needs.build-push.outputs.image-tag }}
          path: |
            results/summary.json
            results/per_item.json
            verdict.json
          if-no-files-found: ignore

  deploy-lambda:
    name: update lambda function
    needs: [build-push, eval-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The function is created once by hand (docs/lambda-deploy.md). Until it
      # exists this job reports the image URI and exits successfully, so a
      # missing function never turns the pipeline red.
      - name: Update function code
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'logistics-dimension-api' }}
          IMAGE_URI: ${{ needs.build-push.outputs.image-uri }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
        run: |
          if ! aws lambda get-function \
                 --region "$AWS_REGION" \
                 --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "::notice title=Lambda 함수 없음::'${FUNCTION_NAME}' 함수가 아직 없어 갱신을 건너뜁니다. 최초 생성은 docs/lambda-deploy.md 의 '최초 1회 절차' 를 따르세요. push 된 이미지: ${IMAGE_URI}"
            {
              echo "### Lambda 갱신 건너뜀"
              echo ""
              echo "함수 \`${FUNCTION_NAME}\` 없음. 최초 생성 절차는 docs/lambda-deploy.md 참고."
              echo ""
              echo "생성 시 사용할 이미지: \`${IMAGE_URI}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "함수 갱신: ${FUNCTION_NAME} -> ${IMAGE_URI}"
          aws lambda update-function-code \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" \
            --publish >/dev/null

          # update-function-code returns before the new image is live. Without
          # this wait a following invocation can still hit the old code.
          aws lambda wait function-updated-v2 \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME"

          # 백엔드는 :live 만 부른다. 게이트를 통과한 버전으로 별칭을 옮겨야 배포가 완결된다.
          VERSION=$(aws lambda publish-version --region "$AWS_REGION" --function-name "$FUNCTION_NAME" --query Version --output text)
          aws lambda update-alias --region "$AWS_REGION" --function-name "$FUNCTION_NAME" \
            --name live --function-version "$VERSION" >/dev/null
          echo "live -> version ${VERSION}"

          # 별칭을 옮긴 직후 첫 호출은 새 버전의 콜드 스타트(초기화 약 10초)라 백엔드 계약(8초)을 넘긴다.
          # 배포 잡이 그 첫 호출을 대신 받아 둔다. 유휴 회수 뒤에는 다시 콜드가 될 수 있다.
          printf '{"version":"2.0","routeKey":"GET /health","rawPath":"/health","rawQueryString":"","headers":{},"requestContext":{"http":{"method":"GET","path":"/health","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"deploy-warmup"},"routeKey":"GET /health","stage":"$default"},"isBase64Encoded":false}' > warm.json
          aws lambda invoke --region "$AWS_REGION" --function-name "${FUNCTION_NAME}:live" \
            --payload fileb://warm.json warm-out.json --query StatusCode --output text
          cat warm-out.json; echo

          # 승격된 모델의 평가 결과가 다음 후보의 기준선이 된다.
          aws s3 cp "s3://${EVAL_BUCKET}/results/${EVAL_PREFIX}/${IMAGE_TAG}/summary.json" \
            "s3://${EVAL_BUCKET}/baselines/${EVAL_PREFIX}/summary.json" --only-show-errors

          {
            echo "### Lambda 갱신 완료"
            echo ""
            echo "- 함수: \`${FUNCTION_NAME}\`"
            echo "- 이미지: \`${IMAGE_URI}\`"
            echo "- live 별칭: 버전 ${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
